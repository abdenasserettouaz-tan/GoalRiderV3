name: Inspect Goal Rider 6.9.4 APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-goalrider-6-9-4.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        env:
          APK_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-8f5c-81f4-8290-9bee3c8c06c3/raw?se=2026-10-01T18%3A36%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=dd787c1c-d484-5901-8bed-d04281325750&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T18%3A31%3A46Z&ske=2026-10-02T18%3A31%3A46Z&sks=b&skv=2026-02-06&sig=rvkIHKiHDxK58PMJqE67QcYvSGS1NYdJAHloW%2B7vRs0%3D"
        run: |
          curl -fL "$APK_URL" -o base.apk
          unzip -q base.apk -d unpacked
          test -s unpacked/assets/smart-companion.js

      - name: Dump Smart Companion implementation
        run: |
          echo '=== SMART COMPANION JS START ==='
          cat unpacked/assets/smart-companion.js
          echo '=== SMART COMPANION JS END ==='
