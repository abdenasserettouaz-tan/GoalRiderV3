name: Publish Goal Rider Online AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-goalrider-online-ai.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful Online AI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/11178984592/zip > artifact.zip
          unzip -q artifact.zip -d artifact
          echo "Artifact contents:"
          find artifact -maxdepth 2 -type f -print
          APK=$(find artifact -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" GoalRider_Online_AI_Android11.apk
          ls -lh GoalRider_Online_AI_Android11.apk

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete goalrider-online-ai-v1 --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          gh release create goalrider-online-ai-v1 \
            GoalRider_Online_AI_Android11.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target main \
            --title "Goal Rider Online AI v1" \
            --notes "Goal Rider Online AI test build for Android 11. Includes the online Nur companion interface."
