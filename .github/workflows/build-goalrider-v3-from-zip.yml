name: Build Goal Rider V3 APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Goal Rider project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q GoalRiderV3_Alpha1_CloudBuild.zip -d buildsrc
          echo "=== TOP LEVEL ==="
          find buildsrc -maxdepth 4 -type f | sort | head -250
          echo "=== CANDIDATE WEB/ANDROID FILES ==="
          find buildsrc -type f \( -name 'index.html' -o -name '*.html' -o -name 'MainActivity.*' -o -name 'AndroidManifest.xml' -o -name 'build.gradle*' -o -name '*.js' \) | sort | head -250
          echo "=== MANIFEST ==="
          MANIFEST=$(find buildsrc -type f -name AndroidManifest.xml | head -1)
          [ -n "$MANIFEST" ] && sed -n '1,220p' "$MANIFEST" || true
          echo "=== MAIN ACTIVITY ==="
          MAIN=$(find buildsrc -type f \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) | head -1)
          [ -n "$MAIN" ] && sed -n '1,300p' "$MAIN" || true
          echo "=== HTML HEADERS ==="
          for f in $(find buildsrc -type f -name '*.html' | head -8); do
            echo "--- $f ---"
            sed -n '1,120p' "$f"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: buildsrc/GoalRiderV3
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoalRider-V3-Inspection-APK
          path: buildsrc/GoalRiderV3/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
