name: Build Goal Rider V3 APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Goal Rider V3 project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q GoalRiderV3_Alpha1_CloudBuild.zip -d buildsrc
          ls -la buildsrc/GoalRiderV3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: buildsrc/GoalRiderV3
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoalRider-V3.0-Alpha1-APK
          path: buildsrc/GoalRiderV3/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
