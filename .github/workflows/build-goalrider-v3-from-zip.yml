name: Build Goal Rider V3 APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Goal Rider project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q GoalRiderV3_Alpha1_CloudBuild.zip -d buildsrc
          echo "=== TOP LEVEL ==="
          find buildsrc -maxdepth 4 -type f | sort | head -250
          echo "=== CANDIDATE WEB/ANDROID FILES ==="
          find buildsrc -type f \( -name 'index.html' -o -name '*.html' -o -name 'MainActivity.*' -o -name 'AndroidManifest.xml' -o -name 'build.gradle*' -o -name '*.js' \) | sort | head -250

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: buildsrc/GoalRiderV3
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoalRider-V3-Inspection-APK
          path: buildsrc/GoalRiderV3/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
