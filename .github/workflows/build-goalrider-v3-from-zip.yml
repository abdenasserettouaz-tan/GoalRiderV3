name: Build Goal Rider Online AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Goal Rider project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q GoalRiderV3_Alpha1_CloudBuild.zip -d buildsrc

      - name: Inject Goal Rider Online AI companion
        run: |
          cat > /tmp/patch_goalrider.py <<'PY'
          from pathlib import Path
          import re

          root = Path('buildsrc/GoalRiderV3')
          html_path = root / 'app/src/main/assets/index.html'
          manifest_path = root / 'app/src/main/AndroidManifest.xml'
          html = html_path.read_text(encoding='utf-8')
          manifest = manifest_path.read_text(encoding='utf-8')

          # Android Internet permission + distinguish this test build from the installed production app.
          if 'android.permission.INTERNET' not in manifest:
              manifest = manifest.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
          manifest = manifest.replace('android:label="Goal Rider"', 'android:label="Goal Rider Online AI"')
          manifest_path.write_text(manifest, encoding='utf-8')

          # Nav: 5 items instead of 4 and add AI companion.
          html = html.replace('grid-template-columns:repeat(4,1fr)', 'grid-template-columns:repeat(5,1fr)')
          old_nav = '''<nav class="nav"><button class="active" onclick="closeSheet()"><span>🏁</span>السباق</button><button onclick="openSheet('missions')"><span>🎯</span>المهمات</button><button onclick="openSheet('rewards')"><span>🎁</span>الجوائز</button><button onclick="openSheet('parents')"><span>🔐</span>الوالدان</button></nav>'''
          new_nav = '''<nav class="nav"><button class="active" onclick="closeSheet()"><span>🏁</span>السباق</button><button onclick="openSheet('missions')"><span>🎯</span>المهمات</button><button onclick="openSheet('companion')"><span>💬</span>المرافق</button><button onclick="openSheet('rewards')"><span>🎁</span>الجوائز</button><button onclick="openSheet('parents')"><span>🔐</span>الوالدان</button></nav>'''
          if old_nav not in html:
              raise SystemExit('nav anchor not found')
          html = html.replace(old_nav, new_nav)

          # Companion styles.
          style_anchor = '</style></head>'
          ai_css = r'''
          <style>
          .aiHero{background:linear-gradient(135deg,#dff8ff,#efffe6);border:1px solid #c8eaf2;border-radius:22px;padding:14px;margin:8px 0 12px;display:flex;gap:12px;align-items:center}.aiBot{width:62px;height:62px;border-radius:20px;background:#72ddd5;display:grid;place-items:center;font-size:34px;box-shadow:0 6px 0 #32aaa2}.aiModes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.aiMode{border:2px solid #d9e8f6;background:#fff;border-radius:16px;padding:12px;text-align:center;color:#203c5d;font-weight:1000}.aiMode.on{border-color:#1b8cf0;background:#eaf6ff;color:#0d67b5}.aiChat{height:250px;overflow:auto;border:1px solid #d7e5f2;border-radius:18px;background:#f9fcff;padding:10px;margin:10px 0}.aiMsg{max-width:88%;padding:9px 11px;border-radius:15px;margin:7px 0;white-space:pre-wrap;line-height:1.6}.aiMsg.user{margin-right:auto;background:#176fe8;color:#fff}.aiMsg.bot{margin-left:auto;background:#fff;border:1px solid #dbe8f3;color:#18324d}.aiComposer{display:grid;grid-template-columns:1fr auto;gap:8px}.aiSend{border:0;border-radius:14px;background:#18a86f;color:#fff;padding:0 18px;font-weight:1000}.aiMeta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.aiSmall{font-size:12px;color:#6b8198;line-height:1.5}.aiStatus{font-size:12px;font-weight:900;color:#47657f;margin:8px 2px}.teacherXp{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;background:#fff3ca;color:#825b00;font-weight:1000;font-size:12px}
          </style>
          '''
          html = html.replace(style_anchor, ai_css + style_anchor)

          # State defaults and normalization.
          html = html.replace("equipped:{paint:'red'}};", "equipped:{paint:'red'},aiKey:'',teacherXP:0,aiLearning:{understood:[],needsReview:[]},aiHistory:[]};")
          norm_old = "s.inventory=Array.isArray(s.inventory)?s.inventory:[];save()}function save()"
          norm_new = "s.inventory=Array.isArray(s.inventory)?s.inventory:[];s.aiKey=String(s.aiKey||'');s.teacherXP=+s.teacherXP||0;s.aiLearning=s.aiLearning&&typeof s.aiLearning==='object'?s.aiLearning:{understood:[],needsReview:[]};s.aiLearning.understood=Array.isArray(s.aiLearning.understood)?s.aiLearning.understood:[];s.aiLearning.needsReview=Array.isArray(s.aiLearning.needsReview)?s.aiLearning.needsReview:[];s.aiHistory=Array.isArray(s.aiHistory)?s.aiHistory:[];save()}function save()"
          if norm_old not in html:
              raise SystemExit('norm anchor not found')
          html = html.replace(norm_old, norm_new)

          # Route the new companion sheet.
          route_old = "function openSheet(type){overlay.classList.add('show');if(type==='missions')renderMissions();if(type==='parents')renderParents();if(type==='rewards')renderRewards()}"
          route_new = "function openSheet(type){overlay.classList.add('show');if(type==='missions')renderMissions();if(type==='parents')renderParents();if(type==='rewards')renderRewards();if(type==='companion')renderCompanion()}"
          if route_old not in html:
              raise SystemExit('route anchor not found')
          html = html.replace(route_old, route_new)

          # Add Gemini API key field to parent settings.
          settings_old = "<b>مكافأة العائلة</b><input class=\"field\" id=\"family\" value=\"${esc(s.weeklyReward)}\"><button class=\"btn\" onclick=\"saveSettings()\">حفظ الإعدادات</button>"
          settings_new = "<b>مكافأة العائلة</b><input class=\"field\" id=\"family\" value=\"${esc(s.weeklyReward)}\"><b>مفتاح Gemini للمرافق الذكي</b><input class=\"field\" id=\"aiKey\" type=\"password\" value=\"${esc(s.aiKey||'')}\" placeholder=\"AIza...\"><small>يُحفظ المفتاح على هذا الهاتف فقط ويُستخدم للاتصال بالمرافق عبر الإنترنت.</small><button class=\"btn\" onclick=\"saveSettings()\">حفظ الإعدادات</button>"
          if settings_old not in html:
              raise SystemExit('settings html anchor not found')
          html = html.replace(settings_old, settings_new)

          save_old = "s.weeklyReward=family.value.trim()||'اختيار فيلم العائلة';save();render();toast('تم حفظ الإعدادات')}"
          save_new = "s.weeklyReward=family.value.trim()||'اختيار فيلم العائلة';if(typeof aiKey!=='undefined')s.aiKey=aiKey.value.trim();save();render();toast('تم حفظ الإعدادات')}"
          if save_old not in html:
              raise SystemExit('save settings anchor not found')
          html = html.replace(save_old, save_new)

          # Online AI implementation. This calls the Goal Rider Supabase Edge Function, which then calls Gemini.
          insert_anchor = "function renderRewards(){"
          ai_js = r'''
          const AI_ENDPOINT='https://euccllpmhrxeagayvsgw.supabase.co/functions/v1/goal-rider-ai';
          const AI_APP='goal-rider-mobile-v1-2026';
          let aiMode='ask';
          function aiModeName(){return aiMode==='teach'?'علّمني':aiMode==='teacher'?'أنا المعلّم':aiMode==='quiz'?'اختبرني':'اسأل نور'}
          function aiLearningSummary(){let a=(s.aiLearning?.understood||[]).slice(-8).join('، '),b=(s.aiLearning?.needsReview||[]).slice(-8).join('، ');return `فهمه: ${a||'لا شيء مسجل بعد'}. يحتاج مراجعة: ${b||'لا شيء مسجل بعد'}. Teacher XP: ${s.teacherXP||0}`}
          function renderCompanion(){
            let hist=(s.aiHistory||[]).slice(-12);
            setSheet('💬 نُور · المرافق الذكي',`<div class="aiHero"><div class="aiBot">🤖</div><div><b style="font-size:20px">مرحباً يوسف 👋</b><div class="aiSmall">أنا نور. اسألني، دعني أعلّمك، أو كن أنت المعلّم وأنا التلميذ.</div><div class="teacherXp">🏅 Teacher XP ${s.teacherXP||0}</div></div></div>
            <div class="aiModes"><button class="aiMode ${aiMode==='ask'?'on':''}" onclick="setAiMode('ask')">💬 اسأل نور</button><button class="aiMode ${aiMode==='teach'?'on':''}" onclick="setAiMode('teach')">📚 علّمني</button><button class="aiMode ${aiMode==='teacher'?'on':''}" onclick="setAiMode('teacher')">🧑‍🏫 أنا المعلّم</button><button class="aiMode ${aiMode==='quiz'?'on':''}" onclick="setAiMode('quiz')">🧠 اختبرني</button></div>
            <div class="aiMeta"><input class="field" id="aiSubject" placeholder="المادة: الفرنسية، الرياضيات..."><input class="field" id="aiLesson" placeholder="الدرس الحالي"></div>
            ${s.aiKey?'':'<div class="card" style="border:1px solid #ffd36c;background:#fffaf0"><b>يلزم إعداد المرافق أول مرة</b><div class="aiSmall">ادخل إلى لوحة الوالدين ← الإعدادات وأضف مفتاح Gemini API.</div></div>'}
            <div class="aiChat" id="aiChat">${hist.length?hist.map(m=>`<div class="aiMsg ${m.role==='assistant'?'bot':'user'}">${esc(m.text)}</div>`).join(''):'<div class="aiMsg bot">اختر وضعاً واكتب رسالتك. 🌟</div>'}</div>
            <div class="aiStatus" id="aiStatus">الوضع: ${aiModeName()} · متصل بالإنترنت</div>
            <div class="aiComposer"><textarea class="field" id="aiInput" rows="2" placeholder="اكتب رسالتك هنا..."></textarea><button class="aiSend" id="aiSend" onclick="sendAi()">إرسال</button></div>`);
            setTimeout(()=>{let c=document.getElementById('aiChat');if(c)c.scrollTop=c.scrollHeight},30)
          }
          function setAiMode(m){aiMode=m;renderCompanion()}
          async function sendAi(){
            if(!s.aiKey){toast('أضف مفتاح Gemini من لوحة الوالدين');return}
            let inp=document.getElementById('aiInput'),msg=(inp?.value||'').trim();if(!msg)return;
            let subject=(document.getElementById('aiSubject')?.value||'').trim(),lesson=(document.getElementById('aiLesson')?.value||'').trim();
            s.aiHistory.push({role:'user',text:msg});s.aiHistory=s.aiHistory.slice(-20);save();renderCompanion();
            let st=document.getElementById('aiStatus'),btn=document.getElementById('aiSend');if(st)st.textContent='نور يفكر…';if(btn)btn.disabled=true;
            try{
              let r=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','x-goalrider-app':AI_APP,'x-gemini-key':s.aiKey},body:JSON.stringify({mode:aiMode,message:msg,subject,lesson,language:'auto',allowSearch:true,learningSummary:aiLearningSummary(),history:(s.aiHistory||[]).slice(-9,-1)})});
              let d=await r.json();if(!r.ok)throw new Error(d?.message||d?.details||d?.error||('HTTP '+r.status));
              let reply=d.reply||'لم أستطع تكوين جواب الآن.';s.aiHistory.push({role:'assistant',text:reply});
              let sig=d.learningSignals||{},u=Array.isArray(sig.understood)?sig.understood:[],n=Array.isArray(sig.needsReview)?sig.needsReview:[];
              s.aiLearning.understood=[...new Set([...(s.aiLearning.understood||[]),...u])].slice(-40);s.aiLearning.needsReview=[...new Set([...(s.aiLearning.needsReview||[]),...n])].slice(-40);
              if(aiMode==='teacher'&&u.length){s.teacherXP+=(Math.min(3,u.length));}
              save();renderCompanion();
            }catch(e){s.aiHistory.push({role:'assistant',text:'تعذر الاتصال بالمرافق الآن: '+(e?.message||e)});save();renderCompanion()}
          }
          function clearAiHistory(){s.aiHistory=[];save();renderCompanion()}
          '''
          if insert_anchor not in html:
              raise SystemExit('insert anchor not found')
          html = html.replace(insert_anchor, ai_js + insert_anchor, 1)

          # Version label.
          html = html.replace('طريق البطل · V3.0', 'طريق البطل · ONLINE AI')
          html = html.replace('<title>Goal Rider V3</title>', '<title>Goal Rider Online AI</title>')
          html_path.write_text(html, encoding='utf-8')
          print('Patched index.html bytes:', html_path.stat().st_size)
          print('Internet permission:', 'android.permission.INTERNET' in manifest_path.read_text(encoding='utf-8'))
          print('AI endpoint injected:', AI_ENDPOINT if False else 'yes')
          PY
          python3 /tmp/patch_goalrider.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Online AI Debug APK
        working-directory: buildsrc/GoalRiderV3
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp buildsrc/GoalRiderV3/app/build/outputs/apk/debug/app-debug.apk GoalRider_Online_AI_ANDROID11.apk
          ls -lh GoalRider_Online_AI_ANDROID11.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoalRider-Online-AI-Android11
          path: GoalRider_Online_AI_ANDROID11.apk
          retention-days: 30
